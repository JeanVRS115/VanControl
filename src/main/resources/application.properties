# Banco de dados H2 salvo como arquivo no projeto
spring.datasource.url=jdbc:h2:file:./data/vancontrol
spring.datasource.username=sa
spring.datasource.password=

# Durante o desenvolvimento, cria e atualiza tabelas sem apagar os dados
spring.jpa.hibernate.ddl-auto=update

# Mostra no console os comandos enviados ao banco
spring.jpa.show-sql=true
